project:
  type: book

book:
  title: "From naive to native form: Shared kinematic signatures of conventionalization and acquisition in manual language"
  chapters:
    - index.qmd           # title page 
    - Manuscript.qmd  

author:
  - name: Šárka Kadavá
    email: kadava@leibniz-zas.de
    corresponding: true
    affiliations:
      - ref: zas
      - ref: goettingen
      - ref: radboud
  - name: Door Spruijt
    affiliations:
      - ref: cologne
  
affiliations:
  - id: zas
    name: Leibniz-Centre General Linguistics (ZAS)
    city: Berlin
    country: Germany
  - id: goettingen
    name: Georg-August-Universität Göttingen
    city: Göttingen
    country: Germany
  - id: radboud
    name: Radboud University
    city: Nijmegen
    country: Netherlands
  - id: cologne
    name: University of Cologne
    city: Cologne
    country: Germany

crossref: 
  chapters: false
format:
  docx:
    reference-doc: reference-style.docx    # your custom reference template (see below)
    number-sections: false           # NHB doesn't number sections
    fig-cap-location: bottom
    tbl-cap-location: top
    keep-md: false
    highlight-style: none
    toc: false
    linestretch: 2

    
