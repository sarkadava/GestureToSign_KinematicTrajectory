project:
  type: book

book:
  title: "When communication fails, physical effort increases but not to greater effect"
  chapters:
    - index.qmd           # title page 
    - Abstract.qmd
    - Main.qmd    # "Introduction" = NHB's "Main"
    - Methods.qmd         # NHB puts Methods last
    - Results-discussion.qmd
    - Outro.qmd
    - References.qmd      # if you want a dedicated ref section

format:
  docx:
    reference-doc: reference-style.docx    # your custom reference template (see below)
    number-sections: false           # NHB doesn't number sections
    fig-cap-location: bottom
    tbl-cap-location: top
    keep-md: false
    highlight-style: none
    toc: false
    linestretch: 2
    
  pdf:
      documentclass: scrreprt
      pdf-engine: xelatex   # or pdflatex
      latex-auto-mk: true
      classoption: [oneside, open=any]
      number-sections: false
      suppress-bibliography: false
      keep-tex: true
      toc: false
      include-in-header:
        text: |
          \usepackage{etoolbox}
          \usepackage{setspace}
          \usepackage{lineno}
          \renewcommand\linenumberfont{\normalfont\small}
          \renewcommand{\thefootnote}{\arabic{footnote}}
          \renewcommand{\thepage}{\arabic{page}}
          \renewcommand{\maketitle}{}
          \newcounter{mychapter}
          \renewcommand{\chapter}[1]{%
            \refstepcounter{mychapter}%
            \par\vspace{6pt}%
            {\large\bfseries #1}%
            \par\vspace{3pt}%
            \setcounter{section}{0}%
          }
          \RedeclareSectionCommand[beforeskip=12pt, afterskip=1pt, font=\normalsize\bfseries]{section}
          \RedeclareSectionCommand[beforeskip=8pt, afterskip=1pt, font=\normalsize\bfseries\itshape]{subsection}
          \RedeclareSectionCommand[beforeskip=6pt, afterskip=1pt, font=\normalsize\itshape]{subsubsection}

execute:
  echo: false
  warning: false
  freeze: auto

bibliography: references.bib
csl: apa.csl    # download from Zotero style repo
link-citations: true